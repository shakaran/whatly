# OpenSSF Scorecard: audits the repository's supply-chain security posture
# (branch protection, pinned actions, token permissions, dangerous workflows,
# SAST, maintenance, and so on) and publishes the result so the README badge and
# https://scorecard.dev can show it. Results are also uploaded to the repo's code
# scanning tab. Runs on a weekly schedule, on branch-protection changes, and on
# push to the default branch. See https://github.com/ossf/scorecard-action.
name: Scorecard supply-chain security

on:
  # Re-run when a branch protection rule changes, since that is one of the checks.
  branch_protection_rule:
  schedule:
    - cron: '25 6 * * 2' # weekly, Tuesday 06:25 UTC
  push:
    branches: [ "main" ]

# Least privilege by default; the job below elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed for the OIDC token that publish_results uses to prove provenance
      # to the OpenSSF API (what makes the badge and the public report work).
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF API so the badge and the public report update.
          # Only meaningful on the default branch of a public repository.
          publish_results: true

      # Keep the SARIF around as a build artifact for local inspection too.
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
