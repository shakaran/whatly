name: AUR

# Build-test the AUR PKGBUILDs, and publish them to the AUR. The publish job runs
# on a version tag push (a release bumps the PKGBUILDs, so the tag matches the
# paths filter) or a manual dispatch, and authenticates with the
# AUR_SSH_PRIVATE_KEY repo secret. See packaging/aur/README.md.

on:
  push:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur.yml'
  pull_request:
    paths:
      - 'packaging/aur/**'
      - '.github/workflows/aur.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v6.8.0)'
        required: true

jobs:
  # ── Build-test the source package in a real Arch container (no secrets) ──────
  build-test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # actions/checkout needs git in the container; without it, it falls back to
      # a REST tarball that does not land in the workspace as expected.
      - name: Install git
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed cmake ninja \
            qt6-webengine qt6-svg qt6-positioning qt6-webchannel qt6-tools
      - name: makepkg (source package)
        run: |
          # makepkg refuses to run as root, so build as an unprivileged user.
          # All deps are installed above, so no -s (which would need root).
          # Use an absolute workspace path: the step's CWD is not reliably the
          # checkout dir inside the container.
          echo "cwd=$(pwd) workspace=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/packaging/aur"
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE/packaging/aur/whatly" /tmp/whatly
          chown -R builder /tmp/whatly
          sudo -u builder bash -c 'cd /tmp/whatly && makepkg --noconfirm --nocheck --clean'

  # ── Publish both packages to the AUR (only when the SSH secret is set) ───────
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Stamp version and checksums
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          echo "PKGVER=$ver" >> "$GITHUB_ENV"
          sed -i "s/^pkgver=.*/pkgver=$ver/" \
            packaging/aur/whatly/PKGBUILD packaging/aur/whatly-bin/PKGBUILD
          # whatly-bin pins the AppImage checksum. On a tag push this can race the
          # release build still uploading it, so wait for the asset to appear.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Whatly-${ver}-x86_64.AppImage"
          for i in $(seq 1 40); do
            if curl -fsSL -o /tmp/app.AppImage "$url"; then break; fi
            echo "AppImage not published yet, waiting 30s ($i/40)..."; sleep 30
          done
          [ -s /tmp/app.AppImage ] || { echo "::error::AppImage never appeared at $url"; exit 1; }
          sum="$(sha256sum /tmp/app.AppImage | awk '{print $1}')"
          sed -i "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/aur/whatly-bin/PKGBUILD

      - name: Publish whatly (source)
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: whatly
          pkgbuild: packaging/aur/whatly/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: angel@guzmanmaeso.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "whatly ${{ env.PKGVER }}"
          updpkgsums: false
          # Already build-tested in the build-test job; the deploy action's own
          # container lacks the Qt toolchain, so don't re-test here.
          test: false

      - name: Publish whatly-bin (prebuilt)
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: whatly-bin
          pkgbuild: packaging/aur/whatly-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: angel@guzmanmaeso.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "whatly-bin ${{ env.PKGVER }}"
          updpkgsums: false
          test: false
