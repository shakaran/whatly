name: Snap

# Least-privilege default; publishing uses the Snap Store credentials secret,
# not the GITHUB_TOKEN, so read access to the repo is all the job needs.
permissions:
  contents: read

# Build the snap on every push to main and publish it to the store's edge
# channel, so edge always tracks the latest commit. A version tag (a release)
# publishes to stable instead, so `snap install whatly` tracks releases.
on:
  push:
    branches: [main]
    # Skip a ~40-minute snap build for changes that cannot affect it.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
    # A release tag publishes to stable (see the channel step below). Tag pushes
    # are not filtered by paths-ignore above, which only applies to branches.
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  # Only the newest commit's snap matters; cancel any in-flight older build.
  group: snap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Never run for forks: they have no store credentials, and edge is ours.
    if: github.repository == 'shakaran/whatly'
    env:
      # Referenced in the publish step's `if:` so the build still runs (and is
      # cached) before the secret has been added, without the job going red.
      SNAP_STORE_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the snap
        uses: snapcore/action-build@v1
        id: build

      # A version tag is a release: publish straight to stable so
      # `snap install whatly` (which tracks stable) gets it. Every other push to
      # main goes to edge, which trails the latest commit.
      - name: Choose channel
        id: channel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=stable" >> "$GITHUB_OUTPUT"
          else
            echo "release=edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: env.SNAP_STORE_CREDS != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.channel.outputs.release }}

      - name: Credentials not set (skipped publish)
        if: env.SNAP_STORE_CREDS == ''
        run: |
          echo "::warning::Built the snap but did not publish: the "
          echo "SNAPCRAFT_STORE_CREDENTIALS secret is not set. Add it with:"
          echo "  snapcraft export-login --snaps=whatly \\"
          echo "    --acls package_push,package_release,package_update \\"
          echo "    --channels=edge,stable snapcraft-creds.txt"
          echo "then paste the file's contents into the repo secret. The stable"
          echo "channel is required so release tags can publish to stable."
