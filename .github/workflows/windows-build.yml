name: Windows Build

permissions:
  contents: read

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          # 6.10 is the project's minimum supported Qt, so CI validates the
          # floor. (Also: released aqtinstall cannot resolve the changed
          # download-repo layout of Qt 6.11+ yet, see miurahr/aqtinstall#959.)
          version: '6.10.3'  # exact pin (#71): bump deliberately, don't glob
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: '& "$env:QT_ROOT_DIR\bin\windeployqt.exe" build\Release\whatly.exe'

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whatly-windows-x64
          path: build/Release
