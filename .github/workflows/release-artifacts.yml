name: Release Artifacts

# On a version tag, build the Windows app and attach it to that GitHub release.
# The release itself is created separately (gh release create / the Release
# workflow); this only uploads binaries to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the build to (e.g. v6.0.0)'
        required: true

permissions:
  contents: write

jobs:
  # Create the GitHub release first, with the matching CHANGELOG.md section as
  # the body — so every release reads like a proper release note instead of the
  # bare auto-generated "What's Changed" list. The artifact jobs below depend on
  # this and only upload their binaries.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create (or update) the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          # Pull the "## <ver> …" section out of CHANGELOG.md (literal match, so
          # the version's dots aren't treated as a regex), up to the next "## ".
          awk -v pfx="## $ver " '
            substr($0,1,length(pfx))==pfx { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::no CHANGELOG.md section for $ver — falling back to generated notes"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md
          fi

  windows:
    needs: create-release
    runs-on: windows-2022
    # Optional Windows code signing via the SignPath Foundation free OSS program
    # (issue #325). Everything below is a no-op until the SIGNPATH_API_TOKEN
    # secret and SIGNPATH_ORGANIZATION_ID variable are set; see
    # packaging/windows-signing.md for the one-time application and setup.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Configure
        run: cmake -G "Visual Studio 17 2022" -A x64 -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: '& "$env:QT_ROOT_DIR\bin\windeployqt.exe" build\Release\whatly.exe'

      # ── Optional: code-sign the built .exe via SignPath (issue #325) ──────────
      # Skipped entirely unless SIGNPATH_API_TOKEN is configured. When it is, the
      # unsigned .exe is uploaded, signed by SignPath's cloud, and the signed
      # copy is written back over build\Release\whatly.exe before it is packaged.
      - name: Upload unsigned .exe for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v6
        with:
          name: whatly-unsigned-exe
          path: build/Release/whatly.exe

      - name: Code-sign with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: whatly
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/Release

      # Build the .msi from the deployed tree (build\Release) before it is
      # renamed for the .zip below. WiX harvests the whole folder, so the signed
      # exe (if signing ran) and every Qt/WebEngine DLL are included.
      - name: Build MSI installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          dotnet tool install --global wix --version 5.*
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          $msi = "whatly-$ver-x64.msi"
          # Absolute path: <Files Include> resolves relative to the .wxs file's
          # own directory, so a relative "build\Release" harvests nothing.
          $src = (Resolve-Path build\Release).Path
          wix build packaging\windows\whatly.wxs -arch x64 -d Version=$ver -d Src=$src -o $msi
          # Guard: the full Qt/WebEngine runtime is ~150 MB, so a tiny .msi means
          # harvesting silently caught nothing (WiX only warns). Fail instead of
          # shipping a broken installer.
          $size = (Get-Item $msi).Length
          if ($size -lt 50MB) { throw "MSI is only $([math]::Round($size/1MB,1)) MB - harvesting likely failed" }
          echo "MSI=$msi" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $name = "whatly-$($tag.TrimStart('v'))-windows-x64.zip"
          Rename-Item build\Release whatly-windows-x64
          Compress-Archive -Path build\whatly-windows-x64 -DestinationPath $name
          echo "ASSET=$name" >> $env:GITHUB_ENV

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" --repo $env:GITHUB_REPOSITORY --title "$tag" --generate-notes
          }
          gh release upload "$tag" "$env:ASSET" "$env:MSI" --clobber --repo $env:GITHUB_REPOSITORY

  # ── Flatpak ────────────────────────────────────────────────────────────────
  # Built inside the KDE 6.9 flatpak SDK image; the manifest's git source is
  # swapped for the checked-out tree so CI always packages the pushed commit.
  flatpak:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install flatpak-builder + the KDE 6.9 runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build the checked-out tree
        run: |
          # Package the pushed commit, not the manifest's pinned git tag.
          python3 - <<'PY'
          import re
          p = "packaging/flatpak/net.shakaran.whatly.yml"
          t = open(p).read()
          t = re.sub(r'(?s)    sources:.*$',
                     "    sources:\n      - type: dir\n        path: ../../\n", t)
          open(p, "w").write(t)
          PY
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=fp-repo --force-clean fp-build \
            packaging/flatpak/net.shakaran.whatly.yml
          flatpak build-bundle fp-repo whatly.flatpak net.shakaran.whatly

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes || true
          gh release upload "$tag" whatly.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  # ── AppImage (+ .zsync delta updates) ───────────────────────────────────────
  appimage:
    needs: create-release
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1   # runners have no FUSE
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          # qtserialport: the qtpositioning nmea plugin links it, and
          # linuxdeploy-plugin-qt fails to deploy without the library present.
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
          cache: true

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libx11-dev libxcb1-dev libfuse2 libnss3

      - name: Build and install into AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build

      # linuxdeploy bundles the *linked* NSS libraries (libnss3, libnssutil3, …)
      # but not the ones NSS dlopen()s at runtime (softokn/freebl/nssckbi). Ship
      # the matching set from this runner, so the app loads its own bundled
      # libsoftokn3 instead of the host's newer one — otherwise the bundled (old)
      # libnssutil3 is missing the NSSUTIL_3.x symbol version the host softokn3
      # requires and Chromium aborts on start-up (issues #11, #12). Copied before
      # linuxdeploy so it patches their RPATH and pulls in their own deps.
      - name: Bundle the NSS PKCS#11 modules
        run: |
          mkdir -p AppDir/usr/lib
          for lib in libsoftokn3.so libfreebl3.so libnssckbi.so libnssdbm3.so; do
            f=$(find /usr/lib/x86_64-linux-gnu -maxdepth 2 -name "$lib" | head -1)
            if [ -n "$f" ]; then cp -v "$f" AppDir/usr/lib/; \
            else echo "::error::NSS module $lib not found on the runner"; exit 1; fi
          done

      - name: Package AppImage
        run: |
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          wget -q "$base/linuxdeploy-x86_64.AppImage"
          wget -q "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export UPDATE_INFORMATION="gh-releases-zsync|shakaran|whatly|latest|Whatly-*-x86_64.AppImage.zsync"
          export OUTPUT="Whatly-${tag#v}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/net.shakaran.whatly.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/net.shakaran.whatly.png \
            --plugin qt --output appimage

      - name: Verify the NSS modules survived bundling
        run: |
          # Guard against a future change (or a linuxdeploy exclude) dropping the
          # dlopen()ed NSS modules again — the class of crash in issues #11/#12.
          test -f AppDir/usr/lib/libsoftokn3.so \
            || { echo "::error::libsoftokn3.so missing from the AppImage bundle"; exit 1; }
          echo "ok: NSS PKCS#11 modules bundled"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes || true
          gh release upload "$tag" Whatly-*-x86_64.AppImage Whatly-*-x86_64.AppImage.zsync --clobber --repo "$GITHUB_REPOSITORY"

  # ── .deb and .rpm (Qt bundled under /opt/whatly, built with fpm) ─────────────
  # The app needs Qt 6.10, which stable distros do not ship, so — like the
  # AppImage/Flatpak/snap — Qt is bundled. The package installs the app under
  # /opt/whatly (RPATH-relocated by linuxdeploy) with a /usr/bin/whatly symlink
  # and the desktop entry + icon in /usr/share, so it works on any distro.
  # Standalone job: a failure here never blocks the other artifacts.
  packages:
    needs: create-release
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport'
          cache: true

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libx11-dev libxcb1-dev libfuse2 \
            libnss3 ruby ruby-dev rpm \
            libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libegl-dev libgles-dev pkg-config \
            libwayland-client0 libwayland-cursor0 libwayland-egl1
          sudo gem install --no-document fpm

      # Native Wayland (idea #8 / #36): the aqt Qt ships no Wayland *client*
      # platform plugin (its qtwayland module is compositor-only), so portable
      # builds fall back to Xwayland. Build just the client side of qtwayland
      # from source, matching the exact installed Qt version, and install it into
      # the Qt tree so the bundler can pick it up. Deliberately best-effort: any
      # failure logs a warning and the AppImage still ships (Xwayland fallback,
      # today's behaviour) rather than breaking the whole build.
      - name: Build the Qt Wayland client plugin (native Wayland)
        run: |
          set -x
          qtver="$(basename "$(dirname "$QT_ROOT_DIR")")"   # e.g. 6.10.1
          echo "Qt version: $qtver"
          ok=0
          if git clone --depth 1 --branch "v$qtver" \
               https://github.com/qt/qtwayland.git qtwayland-src; then
            # Client only: FEATURE_wayland_server=OFF skips the compositor side
            # (the feature is "wayland-server"; there is no "wayland_compositor"),
            # which also avoids its extra dma-buf/DRM/EGL build deps. For a
            # standalone module build the plain FEATURE_ input is not honoured
            # (it warns "not used" and the compositor still configures, failing
            # on its dmabuf-server plugin); forcing the computed QT_FEATURE_ var
            # is what actually skips it.
            if cmake -S qtwayland-src -B qtwayland-build -G Ninja \
                 -DCMAKE_BUILD_TYPE=Release \
                 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
                 -DCMAKE_INSTALL_PREFIX="$QT_ROOT_DIR" \
                 -DFEATURE_wayland_server=OFF \
                 -DQT_FEATURE_wayland_server=OFF \
               && cmake --build qtwayland-build --parallel \
               && cmake --install qtwayland-build; then
              ok=1
            fi
          fi
          # Qt6 names the QPA plugin libqwayland.so (Qt5 used libqwayland-generic.so);
          # match whatever the source actually produced, name-agnostically.
          if [ "$ok" = 1 ] && \
             ls "$QT_ROOT_DIR"/plugins/platforms/libqwayland*.so >/dev/null 2>&1; then
            echo "WHATLY_WAYLAND=1" >> "$GITHUB_ENV"
            echo "native Wayland plugin(s) built:"
            ls -1 "$QT_ROOT_DIR"/plugins/platforms/libqwayland*.so
          else
            echo "::warning::qtwayland client build unavailable; the AppImage will fall back to Xwayland"
          fi

      - name: Build and bundle into AppDir
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --parallel
          DESTDIR="$PWD/AppDir" cmake --install build
          # Bundle the NSS PKCS#11 modules that NSS dlopen()s at runtime (which
          # linuxdeploy's dependency scan misses), so the app never mixes the
          # bundled (old) libnssutil3 with the host's newer libsoftokn3 — the
          # NSSUTIL_3.x start-up crash in issues #11, #12.
          mkdir -p AppDir/usr/lib
          for lib in libsoftokn3.so libfreebl3.so libnssckbi.so libnssdbm3.so; do
            f=$(find /usr/lib/x86_64-linux-gnu -maxdepth 2 -name "$lib" | head -1)
            if [ -n "$f" ]; then cp -v "$f" AppDir/usr/lib/; \
            else echo "::error::NSS module $lib not found on the runner"; exit 1; fi
          done
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          wget -q "$base/linuxdeploy-x86_64.AppImage"
          wget -q "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # When the Wayland client plugin was built above, ask the Qt plugin to
          # also bundle it (and its shell-integration/decoration plugins + the
          # Wayland client libs), so the app runs natively on Wayland instead of
          # through Xwayland. Harmless when unset (xcb-only, as before).
          if [ "${WHATLY_WAYLAND:-0}" = 1 ]; then
            plist=$(cd "$QT_ROOT_DIR/plugins/platforms" 2>/dev/null && \
              ls libqwayland*.so 2>/dev/null | paste -sd ';')
            [ -n "$plist" ] && export EXTRA_PLATFORM_PLUGINS="$plist"
            echo "Wayland platform plugins to bundle: ${EXTRA_PLATFORM_PLUGINS:-<none>}"
          fi
          # Populate AppDir with the bundled Qt runtime (RPATH => $ORIGIN/../lib).
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/net.shakaran.whatly.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/net.shakaran.whatly.png \
            --plugin qt
          # Log whether the Wayland platform plugin made it into the bundle
          # (non-fatal: absence just means Xwayland fallback).
          if find AppDir -name 'libqwayland*.so' -print -quit | grep -q .; then
            echo "ok: native Wayland platform plugin bundled"
          else
            echo "note: no Wayland platform plugin in the bundle (Xwayland fallback)"
          fi

      - name: Stage the package tree
        run: |
          rm -rf pkg
          mkdir -p pkg/opt/whatly pkg/usr/bin pkg/usr/share/applications \
            pkg/usr/share/icons/hicolor/256x256/apps
          cp -a AppDir/usr/. pkg/opt/whatly/
          ln -sf /opt/whatly/bin/whatly pkg/usr/bin/whatly
          # Desktop entry + icon at the system locations, pointing into /opt.
          sed 's|^Exec=whatly|Exec=/opt/whatly/bin/whatly|' \
            AppDir/usr/share/applications/net.shakaran.whatly.desktop \
            > pkg/usr/share/applications/net.shakaran.whatly.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/net.shakaran.whatly.png \
            pkg/usr/share/icons/hicolor/256x256/apps/ || true

      - name: Verify the bundled Qt WebEngine runtime is complete
        run: |
          # A relocated Qt WebEngine that is missing its helper process or its
          # resource/locale data aborts (SIGTRAP) on the first page load — the
          # class of crash reported in issue #3. Fail the build here rather than
          # shipping a package that cannot render anything.
          root=pkg/opt/whatly
          fail=0
          need_file() {
            if ! find "$root" -name "$1" -print -quit | grep -q .; then
              echo "::error::missing from the bundle: $1"
              fail=1
            else
              echo "ok: $1 -> $(find "$root" -name "$1" -print -quit)"
            fi
          }
          need_file QtWebEngineProcess
          need_file icudtl.dat
          need_file qtwebengine_resources.pak
          # NSS PKCS#11 modules: without these the app loads the host's newer
          # libsoftokn3 against the bundled older libnssutil3 and aborts on the
          # NSSUTIL_3.x symbol version (issues #11, #12).
          need_file libsoftokn3.so
          need_file libfreebl3.so
          # At least one localised .pak must be present.
          if ! find "$root" -path '*qtwebengine_locales*.pak' -print -quit | grep -q .; then
            echo "::error::missing from the bundle: qtwebengine_locales/*.pak"
            fail=1
          else
            echo "ok: qtwebengine_locales/*.pak present"
          fi
          exit $fail

      - name: Build .deb and .rpm
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          common=(-s dir -n whatly -v "$ver" --license MIT \
            --description "Feature-rich WhatsApp Web desktop client (Qt WebEngine)" \
            --url "https://github.com/shakaran/whatly" \
            --maintainer "Angel Guzman Maeso <angel@guzmanmaeso.com>" \
            -C pkg --force)
          fpm "${common[@]}" -t deb \
            -d libglib2.0-0 -d libnss3 -d libxcomposite1 -d libxdamage1 \
            -d libxrandr2 -d libxkbcommon0 -d libasound2 \
            -p "whatly_${ver}_amd64.deb" opt usr
          fpm "${common[@]}" -t rpm \
            -d glib2 -d nss -d libXcomposite -d libXdamage -d libXrandr \
            -d libxkbcommon -d alsa-lib \
            -p "whatly-${ver}-1.x86_64.rpm" opt usr

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes || true
          gh release upload "$tag" whatly_*_amd64.deb whatly-*.x86_64.rpm --clobber --repo "$GITHUB_REPOSITORY"

  # ── Native openSUSE Tumbleweed rpm (distro Qt, no bundling) ──────────────────
  # Tumbleweed ships Qt 6.10+, so we build against the system Qt inside a
  # Tumbleweed container and produce a small native rpm that depends on the
  # distro's Qt packages (no bundled Qt). This complements the portable bundled
  # rpm from the `packages` job, which targets older distros. It also proves the
  # OBS spec (packaging/obs/whatly.spec) still builds. Standalone/best-effort: a
  # failure here never blocks the other artifacts.
  opensuse:
    needs: create-release
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest
    steps:
      # git must exist before checkout so it can fetch submodules (libnotify-qt).
      - name: Install toolchain and build dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            git tar gzip rpm-build cmake ninja gcc-c++ \
            'cmake(Qt6Core)' 'cmake(Qt6Widgets)' 'cmake(Qt6WebEngineWidgets)' \
            'cmake(Qt6WebChannel)' 'cmake(Qt6Positioning)' 'cmake(Qt6DBus)' \
            'cmake(Qt6Svg)' 'cmake(Qt6LinguistTools)' \
            'pkgconfig(x11)' 'pkgconfig(xcb)'

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build the native rpm with the OBS spec
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/{SOURCES,SPECS}
          # Tarball of the checked-out tree (submodules included, .git excluded)
          # with a whatly-<ver>/ top dir, matching the spec's %autosetup.
          tar czf ~/rpmbuild/SOURCES/whatly-"$ver".tar.gz \
            --transform "s,^\./,whatly-$ver/," \
            --exclude=./.git --exclude=./build --exclude=./pkgroot .
          sed "s/^Version:.*/Version:        $ver/" \
            packaging/obs/whatly.spec > ~/rpmbuild/SPECS/whatly.spec
          # debug_package off: no OBS debuginfo machinery in a bare container.
          rpmbuild -ba --define "debug_package %{nil}" ~/rpmbuild/SPECS/whatly.spec
          cp ~/rpmbuild/RPMS/*/whatly-*.rpm .
          ls -la whatly-*.rpm

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: whatly-*.rpm
