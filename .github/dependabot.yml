version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. The workflows pin every action to
  # a full commit SHA (with the tag in a comment) for supply-chain safety; without
  # an updater those pins go stale, so Dependabot bumps them here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
